server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: toss-stock-app
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_SERVICE}?TNS_ADMIN=${ORACLE_TNS_ADMIN}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    hikari:
      pool-name: toss-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: never   # 실 DB에 자동 DDL 금지 (DDL은 db/watchlist.sql 로 수동/IT)

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cloudhandson.tossstock.watchlist
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'   # Oracle: null 파라미터 ORA-17004 방지

# 토스증권 Open API — 값은 .env 에서 주입 (없으면 빈 문자열, 기동은 됨)
toss:
  base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}

# 뉴스 S1-S5 분류 (#425). 미국 종목 피드 2개 추가(2026-09-25, #808 — 자동매매가
# 미국 종목 호재를 원천적으로 못 보던 문제 해소. NewsClassifier가 티커로 인식).
news:
  feeds: ${NEWS_RSS_FEEDS:https://www.hankyung.com/feed/finance,https://www.yna.co.kr/rss/economy.xml,https://feeds.content.dowjones.io/public/rss/mw_topstories,https://www.cnbc.com/id/100003114/device/rss/rss.html}
  # LLM(OpenAI 호환): base-url + api-key + model 자유 지정. OPENROUTER_* 는 하위호환 폴백.
  llm-api-key: ${LLM_API_KEY:${OPENROUTER_API_KEY:}}
  llm-model: ${LLM_MODEL:${OPENROUTER_MODEL:gpt-4o-mini}}
  llm-base-url: ${LLM_BASE_URL:${OPENROUTER_URL:https://api.openai.com/v1}}
  interval-ms: ${NEWS_INTERVAL_MS:600000}
  max-per-run: ${NEWS_MAX_PER_RUN:40}

# 장 시작/마감 Discord 브리핑 (#439). webhook-url 없으면 비활성.
briefing:
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  watchlist-limit: ${BRIEFING_WATCHLIST_LIMIT:10}
  open-cron: ${BRIEFING_OPEN_CRON:0 0 9 * * MON-FRI}
  close-cron: ${BRIEFING_CLOSE_CRON:0 30 15 * * MON-FRI}

# 추적손절 재진입 알림 (docs/design/reentry-alert). webhook-url 없으면 비활성.
reentry-alert:
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  cron: ${REENTRY_ALERT_CRON:0 * 9-15 * * MON-FRI}

# 자동매매 엔진 (#808). dry-run 기본값 true — 반드시 명시적으로 false 로 바꿔야 실주문 나감.
# DB auto_trade_state.dry_run 도 별도 존재(이중 안전장치, OrderExecutor#effectiveDryRun 참고).
auto-trade:
  dry-run: ${AUTO_TRADE_DRY_RUN:true}
  # 2026-09-28: 실 입금액(400만원) 확인, 2종목×200만원으로 좁힘(원칙 §5 하한).
  # 2026-09-29: 재조정 — 지금은 시스템 만든 지 얼마 안 돼 검증 단계라, 수익 극대화보다
  # 표본 확보가 우선. 왕복비용이 비율기반(136원/6만원≈0.23%)이라 소액도 불리하지 않음.
  # 검증되면 다시 §5대로 2~5종목 집중+금액 확대로 되돌릴 예정.
  # 2026-10-01: #818 레인지 트레이딩 트랙 신설에 맞춰 400만원 예산을 모멘텀 300만/레인지
  # 100만으로 재분배(사용자 결정) — total-budget·per-symbol-budget 하향. 실제로는 012330
  # 포지션에 377만원이 묶여있어(매수가능금액 22만원뿐) 당장은 숫자상 재분배일 뿐, 포지션
  # 매도로 현금이 풀리면 그때부터 실질적으로 분리 적용됨.
  total-budget: ${AUTO_TRADE_TOTAL_BUDGET:3000000}
  max-symbols: ${AUTO_TRADE_MAX_SYMBOLS:5}
  per-symbol-budget: ${AUTO_TRADE_PER_SYMBOL_BUDGET:600000}
  circuit-breaker-pct: ${AUTO_TRADE_CIRCUIT_BREAKER_PCT:15.0}
  hard-stop-pct: ${AUTO_TRADE_HARD_STOP_PCT:10.0}
  trail-stop-pct: ${AUTO_TRADE_TRAIL_STOP_PCT:10.0}
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  # 2026-09-29: yml의 이 값이 AutoTradeScheduler 어노테이션 기본값보다 우선 적용된다는 걸
  # 놓쳐서, "1분마다 상시 실행"으로 고쳤다고 한 게 실제로는 계속 "9-15시만" 이었음(버그).
  cron: ${AUTO_TRADE_CRON:0 * * * * *}
  # 후보 자동등록/자동해제(CandidateDiscoveryService, 2026-09-29) — 매수 틱보다 덜 자주면 충분.
  discovery-cron: ${AUTO_TRADE_DISCOVERY_CRON:0 */15 * * * *}
  # 인기 판정: (거래량 스파이크) OR (당일 가격변동). 거래량 임계값 3.0→1.5(2026-09-25)→1.2 재조정 —
  # 실측 6건(Meta 1.57/Disney 0.97/Lear 0.96/AP위성 1.05/컴투스 <1)이 1.5 근처~이하에 몰려있었음.
  # price-move-pct는 2026-09-29 추가 — 삼성전기(009150)가 6조원 투자 발표 당일 +2.55%나 움직였는데
  # 거래량비는 0.90배(평소도 워낙 유동성이 커서 상대비율이 잘 안 튐)로 탈락한 사례 때문에, 초대형·
  # 고유동성 종목은 가격반응만으로도 인기로 인정하도록 OR 추가.
  # 2026-09-30: 검증 단계(표본 확보 우선, 사용자 명시적 요청)로 재조정 — 1.2→1.0(평균 거래량만
  # 넘으면 인정), 2.0%→1.5%. 둘 다 확정값 아님, 실거래 데이터 쌓이면 다시 조정.
  volume-spike-window-days: ${AUTO_TRADE_VOLUME_WINDOW_DAYS:20}
  volume-spike-multiplier: ${AUTO_TRADE_VOLUME_MULTIPLIER:1.0}
  price-move-pct: ${AUTO_TRADE_PRICE_MOVE_PCT:1.5}
  # 저평가 판정(#808 후속, 2026-09-25). 실시간 PER/PBR을 ValuationClient(네이버/야후, 비공식 API)로
  # 조회해 둘 다 이 값 이하일 때만 통과. 해성디에스(PER 15.5~19.5/PBR 1.44~1.8)는 통과, 삼성전자
  # (PBR 3.33)·AAPL(PER 38.6/PBR 45.6)은 탈락하는 수준으로 초기값 설정.
  # 2026-09-30: 검증 단계 완화(20→30, 2.0→3.0) — 여전히 삼성전기(PER 117/PBR 11.26) 같은 극단값은
  # 이 절대치만으로는 못 넘고, CapitalReturnCatalystDetector의 성장촉매 OR-게이트로 넘게 됨(README §11).
  max-per: ${AUTO_TRADE_MAX_PER:30.0}
  max-pbr: ${AUTO_TRADE_MAX_PBR:3.0}
  # 원칙 §3 체크리스트 중 자동화 가능한 5항목(2026-09-25 추가, 사용자 지적으로 재점검 후 도입).
  # "대부분 YES"이지 "전부 YES"는 아니므로 5개 중 min-fundamental-pass개 이상 통과를 요구.
  # 최초 4(80%)는 너무 빡빡하다는 지적(2026-09-25)으로 3(과반)으로 완화.
  # 2026-09-30: 검증 단계 추가 완화 3→2(5개 중 40%) — 명백한 결격(적자전환 등) 다발이면 여전히 막히나,
  # 문턱이 낮아진 만큼 실거래 늘려서 데이터부터 쌓기로(사용자 명시적 요청).
  max-debt-ratio: ${AUTO_TRADE_MAX_DEBT_RATIO:200.0}
  # 2026-09-30: 검증 단계 완화 5억→3억(KRW), 35만→20만(USD) — 소형주 진입폭 넓히되 완전히 없애진 않음
  # (체결/슬리피지 리스크는 여전히 존재하므로 유동성 게이트 자체를 없애지는 않음).
  min-avg-trading-value: ${AUTO_TRADE_MIN_AVG_TRADING_VALUE:300000000}
  # 2026-09-30 버그 수정: 미국 종목 거래대금(달러)을 원화 기준과 그대로 비교하고 있었음
  # (LOCO 하루 거래대금 $3.55M을 5억으로 비교 → 항상 탈락). 별도 달러 기준 추가.
  min-avg-trading-value-usd: ${AUTO_TRADE_MIN_AVG_TRADING_VALUE_USD:200000}
  relative-strength-window-days: ${AUTO_TRADE_RS_WINDOW_DAYS:20}
  min-fundamental-pass: ${AUTO_TRADE_MIN_FUNDAMENTAL_PASS:2}
  # 후보 최대 보유기간(#828, 2026-10-05 사용자 확정 30일) — 호재가 소멸해도 저평가+상대강세면
  # 후보를 계속 유지하는데, 그 유지가 무기한이 되면 "좀비 후보"가 쌓이므로 등록(created_at)
  # 기준 상한을 둔다. 상한을 넘으면 밸류에이션이 아무리 좋아도 해제.
  candidate-max-retention-days: ${AUTO_TRADE_CANDIDATE_MAX_RETENTION_DAYS:30}
  # #835/#836 QA(코덱스 리뷰, 2026-10-07): 뉴스소멸(NEWS_FADED)로 매도된 종목이 저평가+상대강세
  # 판정이 true→false→true로 흔들리면(밸류에이션 임계값 근처에서의 작은 변동 등) 재진입→재매도가
  # 반복될 수 있음 — 매도 직후 일정 시간은 같은 종목을 #828 유지경로로 재매수하지 않게 막는 쿨다운.
  # 신규 호재(S4+)가 뜨면 이 쿨다운과 무관하게 정상 매수 가능(쿨다운은 "뉴스 없이 재진입"만 막음).
  news-faded-cooldown-minutes: ${AUTO_TRADE_NEWS_FADED_COOLDOWN_MINUTES:60}
  # #839 실사고(2026-10-07): 트레일스탑(212,000) 7초 뒤 더 비싼 가격(212,500)으로 재매수해
  # 가격차만으로 확정손실. 손절 후 이 시간 동안은 뉴스/촉매 신선도와 무관하게 같은 종목 재매수 금지.
  stop-exit-cooldown-minutes: ${AUTO_TRADE_STOP_EXIT_COOLDOWN_MINUTES:30}
  # #838(2026-10-07, 안랩/053800 실사례): 급등 + 실적직결 촉매 없음 조합은 매수 보류
  # (단기 트레이더 쏠림→되돌림 위험). #859로 측정 방식만 교체, 취지는 동일.
  # #859(2026-10-08): 급등 필터 측정 교정. 기존 extreme-move-pct(일봉 당일변동률)는 장중 판단
  # 시점에 어제 값이거나 미완성 바라 "지금 이미 올라있다"를 측정 못 했고, 기준선이 전일종가라
  # 어제 급등한 종목은 다음날 음수로 보여 통과했다(손실 6건 중 4건이 이 경로). 최근 N거래일
  # 최저 종가 대비 실시간 체결가 상승률로 교체. 6.0은 실측 n=9(수익 전부 +4.5%↓, 손실 대부분
  # +9.9%↑) 기반 잠정값 — 운영하며 조정.
  max-extension-pct: ${AUTO_TRADE_MAX_EXTENSION_PCT:6.0}
  extension-lookback-days: ${AUTO_TRADE_EXTENSION_LOOKBACK_DAYS:5}
  # #855(2026-10-08): 재평가촉매 면제의 밸류에이션 상한 배수. max-per/max-pbr(저평가 기준)의
  # 이 배수를 넘으면 촉매 키워드가 있어도 면제하지 않는다(기본 3배 = PER 90 / PBR 9).
  # 실측: 포스코퓨처엠 PER 392·삼성SDI PER없음이 촉매 하나로 전 필터를 면제받고 손실.
  catalyst-valuation-multiple: ${AUTO_TRADE_CATALYST_VALUATION_MULTIPLE:3.0}

  # #873 원칙 §4 추적손절 완화 — "대박 구간(+300% 등)은 -15~20%로 완화 가능".
  # 멀티배거를 10% 흔들림에 털리지 않게 한다. 임계는 원칙 문서의 예시 수치(+300%)를,
  # 완화폭은 원칙이 준 15~20% 중 보수적인 쪽(15%)을 기본값으로 둔다. 측정 기준은 피크.
  multibagger-gain-pct: ${AUTO_TRADE_MULTIBAGGER_GAIN_PCT:300.0}
  multibagger-trail-stop-pct: ${AUTO_TRADE_MULTIBAGGER_TRAIL_STOP_PCT:15.0}
  # #873 원칙 §4 "지수 하락기 보정 — 지수 대비 -10% 언더퍼폼 시 교체 고려".
  # 원칙이 손절은 "필수 하드룰"로, 이건 "고려"로 쓰므로 자동 매도하지 않고 알림만 보낸다.
  index-lag-alert-pct: ${AUTO_TRADE_INDEX_LAG_ALERT_PCT:10.0}
  # #874 원칙 §6 '주간 운영 루틴' 점검 리포트. 월요일 장 시작 30분 전 — 점검은 거래
  # 전에 해야 재료가 된다. 거래 주기(auto-trade.cron)는 바꾸지 않는다(설계 §1 참조).
  weekly-review-cron: ${AUTO_TRADE_WEEKLY_REVIEW_CRON:0 30 8 * * MON}
  gate:
    # 2026-09-30: 35→20으로 완화. 실측(최근 25거래일 breadth 분포: 16.3~69.9%, 중앙값≈45%) —
    # 35 기준은 5/25일(20%, 오늘 30.8% 포함하는 통상적 약세일까지)을 통째로 막았음. 사용자가
    # "전체 상승일 때만 사는 게 맞냐"고 재질문 — 매수 논리 자체가 종목별 촉매/펀더멘털이라
    # 시장 전체 breadth와 직접 인과관계가 약함. 20은 이번 25일 중 가장 심한 날(16.3%)급만 차단.
    # "지속 하락장" 방어는 이 게이트가 아니라 서킷브레이커(전체손익 -15% 트립)와 종목별
    # 손절(-10%/추적손절)이 담당 — 진입 타이밍과 무관하게 계속 작동하므로 완전 무방비는 아님.
    # 2026-10-01: MARKET S1(강한악재) 뉴스 카운트 조건 제거 — 실측(9/30 밤 미장)에서 S1 6건이
    # "코스피 3거래일 연속 하락", "외국인 팔자 행렬" 같은 이미 일어난 가격하락을 사후 보도하는
    # 후행(lagging) 뉴스였음. 선행 신호가 아닌 걸 매수 차단의 필수(mandatory) 조건으로 쓰는 건
    # 맞지 않고, breadth 자체가 이미 그 가격하락을 수치로 반영하므로 중복이기도 함(사용자 지적).
    # max-s1-count/lookback-days 설정 제거 — breadth만으로 판정.
    min-breadth-pct: ${AUTO_TRADE_GATE_MIN_BREADTH:20}
    # #879 breadth 집계 최소 표본. 미만이면 '신호 없음'으로 보고 통과시킨다.
    # 실측(2026-10-08): 기준일 join 에 KR 3,699종목 / US 7종목 — US 는 계산 불가다.
    # 표본 수로 판단하므로 US 커버리지가 늘면 코드 변경 없이 게이트가 켜진다.
    min-breadth-sample: ${AUTO_TRADE_GATE_MIN_BREADTH_SAMPLE:100}

# 레인지(박스권) 스윙매매 — 2번째 자동매매 트랙 (#818). 모멘텀(#808)과 예산·슬롯·DB 완전 분리.
# dry-run 기본값 true — 반드시 명시적으로 false 로 바꿔야 실주문 나감.
# DB range_trade_state.dry_run 도 별도 존재(이중 안전장치, RangeOrderExecutor#effectiveDryRun 참고).
range-trade:
  dry-run: ${RANGE_TRADE_DRY_RUN:true}
  # 2026-10-01 사용자 결정: 기존 400만원을 모멘텀 300만/레인지 100만으로 재분배(설계서 §12).
  total-budget: ${RANGE_TRADE_TOTAL_BUDGET:1000000}
  # 슬롯 2개 × 50만원(Developer 단계 확정). 왜 2슬롯인가:
  #  - 원칙 §5(소수 집중)와 100만원 예산의 교집합 — 3슬롯(33만원)이면 1종목당 금액이 너무 작아져
  #    주가 10만원대 종목은 3주밖에 못 사고, 수량 반올림 버림(정수 주)이 예산의 1/3까지 낭비될 수 있음.
  #  - 목표 순수익 3%(설계서 §12 역산 전제)가 50만원 기준 1.5만원/회로 유의미한 크기.
  #  - 1슬롯이면 종목 하나에 전액이 걸려 분산이 0이라 제외.
  max-symbols: ${RANGE_TRADE_MAX_SYMBOLS:2}
  per-symbol-budget: ${RANGE_TRADE_PER_SYMBOL_BUDGET:500000}
  # 서킷브레이커(2026-10-02 추가) — 설계서 v1엔 함수/임계값이 없어 미구현이었음(QA 지적).
  # #808과 동일 기준(15%) 재사용 — 레인지 트랙은 종목당 손절이 -5%(breakdown-pct)로 더 타이트해서
  # 전체 15% 도달 전에 개별 손절이 먼저 걸릴 가능성이 높지만, 다종목 동시 악재 같은 상황을 대비한
  # 최후 방어선으로 둠.
  circuit-breaker-pct: ${RANGE_TRADE_CIRCUIT_BREAKER_PCT:15.0}
  # 밴드 판정 파라미터 — 설계서 §12 확정값. min-width-pct 만 Ellman ROO 역산값(왕복비용 0.23% 실측 +
  # 목표 순수익 3% 가정 → 폭 26% 이상이어야 최악의 진입/청산 조합에서도 남음), 나머지는 초기 추정치.
  window-days: ${RANGE_TRADE_WINDOW_DAYS:60}
  min-width-pct: ${RANGE_TRADE_MIN_WIDTH_PCT:26.0}
  max-width-pct: ${RANGE_TRADE_MAX_WIDTH_PCT:50.0}
  max-trend-drift-pct: ${RANGE_TRADE_MAX_TREND_DRIFT_PCT:15.0}
  entry-zone-pct: ${RANGE_TRADE_ENTRY_ZONE_PCT:10.0}
  exit-zone-pct: ${RANGE_TRADE_EXIT_ZONE_PCT:10.0}
  breakdown-pct: ${RANGE_TRADE_BREAKDOWN_PCT:5.0}
  # 유동성 게이트 — #808 과 동일 기준(LiquidityChecker 재사용, 설계서 §4).
  min-avg-trading-value: ${RANGE_TRADE_MIN_AVG_TRADING_VALUE:300000000}
  # Ellman "Banned Stocks" 게이트의 예상 보유기간(일). 그의 월간 옵션 주기(약 30일)를 차용한 가정값.
  holding-horizon-days: ${RANGE_TRADE_HOLDING_HORIZON_DAYS:30}
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  # 1일 1회, 장마감 후. DailyCollector 의 일봉 갱신(15:40) 이후로 버퍼를 둔 16:00(설계서 §8).
  cron: ${RANGE_TRADE_CRON:0 0 16 * * MON-FRI}

logging:
  level:
    com.cloudhandson.tossstock: INFO
