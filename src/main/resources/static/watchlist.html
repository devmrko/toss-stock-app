<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>워치리스트 · 거래량 모니터링</title>
  <style>
    :root { --up:#e03131; --down:#1971c2; --line:#e9ecef; --muted:#868e96; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Apple SD Gothic Neo", Pretendard, sans-serif;
           margin: 0; background: #f8f9fa; color: #212529; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid var(--line);
             display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    input { padding: 9px 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 14px; }
    input[name=symbol] { width: 130px; }
    input[name=memo] { flex: 1; min-width: 140px; }
    button { padding: 9px 16px; border: 0; border-radius: 8px; background: #228be6; color: #fff;
             font-size: 14px; cursor: pointer; }
    button.del { background: transparent; color: var(--muted); padding: 4px 8px; }
    button.del:hover { color: var(--up); }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    th, td { padding: 11px 12px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
    th { background: #f1f3f5; color: #495057; font-weight: 600; font-size: 12px; text-align: right; }
    th.sortable{cursor:pointer;user-select:none;} th.sortable:hover{color:#212529;}
    th .arr{font-size:10px;margin-left:3px;color:#868e96;}
    th:nth-child(1), td:nth-child(1) { text-align: center; width: 44px; color: var(--muted); }
    th:nth-child(2), td:nth-child(2) { text-align: left; }
    td.num { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
    .name { font-weight: 600; } .code { color: var(--muted); font-size: 12px; margin-left: 6px; }
    .sector{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e7f5ff;color:#1971c2;margin-left:6px;font-weight:600;}
    .news-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;}
    .news-badge.nb-up{background:#ffe3e3;color:#e03131;} .news-badge.nb-down{background:#e7f5ff;color:#1971c2;}
    tr.clickable{cursor:pointer;} tr.clickable:hover td{background:#f8f9fa;}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto;}
    .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2);}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;}
    .modal-head button{background:transparent;color:var(--muted);font-size:18px;padding:2px 8px;border:0;cursor:pointer;}
    .modal-body{padding:6px 18px 18px;max-height:70vh;overflow:auto;}
    .nrow{padding:12px 0;border-bottom:1px solid var(--line);} .nrow:last-child{border-bottom:0;}
    .nrow .nt{font-weight:600;font-size:14px;line-height:1.4;margin-top:4px;} .nrow .nt a{color:inherit;text-decoration:none;}
    .nrow .nm{color:var(--muted);font-size:12px;margin-top:4px;} .nrow .na{font-size:13px;color:#343a40;margin-top:6px;line-height:1.5;}
    .stale td { opacity: .5; }
    .empty { text-align: center; color: var(--muted); padding: 40px; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#37b24d; margin-right:6px; }
  </style>
</head>
<body>
  <header>
    <h1>📈 워치리스트</h1>
    <span class="sub"><span class="dot"></span>거래량 순 · 5초 자동 갱신 · 상위 50</span>
    <span class="sub" id="updated" style="margin-left:auto"></span>
  </header>
  <div class="wrap">
    <form id="addForm">
      <input name="symbol" placeholder="종목코드 (예: 005930)" maxlength="20" required/>
      <input name="memo" placeholder="메모 (선택)"/>
      <button type="submit">+ 추가</button>
    </form>
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="rank">#<span class="arr"></span></th>
          <th class="sortable" data-sort="name">종목<span class="arr"></span></th>
          <th class="sortable" data-sort="lastPrice">현재가<span class="arr"></span></th>
          <th class="sortable" data-sort="changeRate">등락률<span class="arr"></span></th>
          <th class="sortable" data-sort="volume">거래량<span class="arr"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td class="empty" colspan="6">불러오는 중…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="newsModal" class="modal-bg" style="display:none">
    <div class="modal">
      <div class="modal-head"><span id="modalTitle"></span><button id="modalClose">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const fmt = new Intl.NumberFormat('ko-KR');
    const $rows = document.getElementById('rows');
    const $updated = document.getElementById('updated');

    function cls(rate) { return rate == null ? 'flat' : rate > 0 ? 'up' : rate < 0 ? 'down' : 'flat'; }
    function sign(n) { return n > 0 ? '+' : ''; }

    let signals = {};
    const sDir = lv => (lv==='S1'||lv==='S2') ? 'down' : (lv==='S4'||lv==='S5') ? 'up' : 'flat';
    const sStr = lv => ({S1:2,S2:1,S4:1,S5:2})[lv] || 0;
    const sLabel = lv => ({S1:'강한악재',S2:'약한악재',S4:'약한호재',S5:'강한호재'})[lv] || '';
    function newsBadge(symbol, sector) {
      const a = signals[symbol], b = signals[sector];
      const lv = (sStr(a) >= sStr(b)) ? a : b;
      if (!lv || lv === 'S3') return '';
      const e = sDir(lv)==='down' ? '🔴' : '🟢';
      const on = (lv===a) ? symbol : sector;
      return `<span class="news-badge nb-${sDir(lv)}" title="${on} ${sLabel(lv)}">${e}${lv}</span>`;
    }

    async function load() {
      try {
        const [res, sig] = await Promise.all([
          fetch('/api/watchlist/quotes'),
          fetch('/api/news/signals').then(r => r.ok ? r.json() : {}).catch(() => ({}))
        ]);
        signals = sig || {};
        if (!res.ok) throw new Error('HTTP ' + res.status);
        lastRows = await res.json();
        render(lastRows);
        $updated.textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR');
      } catch (e) {
        $updated.textContent = '갱신 실패 — 재시도 중';
      }
    }

    function render(quotes) {
      if (!quotes.length) {
        $rows.innerHTML = '<tr><td class="empty" colspan="6">워치리스트가 비어 있어요. 위에서 종목코드를 추가하세요.</td></tr>';
        return;
      }
      $rows.innerHTML = sortRows(quotes).map(q => {
        const rate = q.changeRate;
        const price = q.lastPrice != null ? fmt.format(q.lastPrice) : '-';
        const rateTxt = rate != null ? sign(rate) + rate.toFixed(2) + '%' : '-';
        const amt = q.changeAmount != null ? ' (' + sign(q.changeAmount) + fmt.format(q.changeAmount) + ')' : '';
        const vol = q.volume != null ? fmt.format(q.volume) : '-';
        return `<tr class="clickable ${q.stale ? 'stale' : ''}" data-symbol="${q.symbol}" data-sector="${q.sector || ''}" data-name="${q.name ?? ''}">
          <td>${q.rank}</td>
          <td><span class="name">${q.name ?? '-'}</span><span class="code">${q.symbol}</span>${q.sector ? `<span class="sector">${q.sector}</span>` : ''}${newsBadge(q.symbol, q.sector)}</td>
          <td class="num">${price}</td>
          <td class="num ${cls(rate)}">${rateTxt}<span style="font-size:11px">${amt}</span></td>
          <td class="num">${vol}</td>
          <td><button class="del" data-id="${q.id}" title="삭제">✕</button></td>
        </tr>`;
      }).join('');
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = { symbol: f.symbol.value.trim(), memo: f.memo.value.trim() || null };
      const res = await fetch('/api/watchlist', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (res.status === 409) { alert('이미 워치리스트에 있는 종목입니다.'); return; }
      if (!res.ok) { alert('추가 실패 (HTTP ' + res.status + ')'); return; }
      f.reset(); f.symbol.focus();
      load();
    });

    $rows.addEventListener('click', async (e) => {
      const btn = e.target.closest('button.del');
      if (btn) {   // 삭제 버튼
        if (!confirm('이 종목을 워치리스트에서 삭제할까요?')) return;
        await fetch('/api/watchlist/' + btn.dataset.id, { method: 'DELETE' });
        load();
        return;
      }
      const tr = e.target.closest('tr');   // 행 클릭 → 뉴스 모달
      if (tr && tr.dataset.symbol) openNews(tr.dataset.symbol, tr.dataset.sector, tr.dataset.name);
    });

    // 뉴스 모달
    const $modal = document.getElementById('newsModal'), $mTitle = document.getElementById('modalTitle'), $mBody = document.getElementById('modalBody');
    const closeModal = () => $modal.style.display = 'none';
    document.getElementById('modalClose').addEventListener('click', closeModal);
    $modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });

    async function openNews(symbol, sector, name) {
      $mTitle.textContent = (name || symbol) + ' · ' + symbol + (sector ? ' · ' + sector : '');
      $mBody.innerHTML = '<div class="nm" style="padding:14px 0">불러오는 중…</div>';
      $modal.style.display = 'flex';
      try {
        const reqs = [fetch('/api/news?limit=20&key=' + encodeURIComponent(symbol)).then(r => r.json())];
        if (sector) reqs.push(fetch('/api/news?limit=20&key=' + encodeURIComponent(sector)).then(r => r.json()));
        const seen = new Set(), merged = [];
        (await Promise.all(reqs)).flat().forEach(n => { if (!seen.has(n.id)) { seen.add(n.id); merged.push(n); } });
        merged.sort((a, b) => new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0));
        if (!merged.length) { $mBody.innerHTML = '<div class="nm" style="padding:14px 0">관련 활성 뉴스가 없어요.</div>'; return; }
        $mBody.innerHTML = merged.map(n => {
          const tags = (n.sentiment || '').split(',').map(p => { const [k, l] = p.split(':'); return { k, l }; })
            .filter(t => (t.k === symbol || t.k === sector) && t.l !== 'S3')
            .map(t => `<span class="news-badge nb-${sDir(t.l)}">${sDir(t.l)==='down'?'🔴':'🟢'}${t.l} ${sLabel(t.l)}</span>`).join('');
          const when = n.publishedAt ? new Date(n.publishedAt).toLocaleString('ko-KR') : '';
          const title = n.url ? `<a href="${n.url}" target="_blank">${n.title}</a>` : n.title;
          return `<div class="nrow"><div>${tags}</div><div class="nt">${title}</div><div class="nm">${n.source||''} · ${when} · ${n.kind||''}</div>${n.rationale?`<div class="na">${n.rationale}</div>`:''}</div>`;
        }).join('');
      } catch (e) { $mBody.innerHTML = '<div class="nm" style="padding:14px 0">불러오기 실패</div>'; }
    }

    // 컬럼 정렬 (클라이언트, 폴링 무관)
    let lastRows = [], sortKey = 'volume', sortDir = -1;
    function sortRows(rows) {
      return rows.slice().sort((a, b) => {
        if (sortKey === 'name') return sortDir * String(a.name || '').localeCompare(String(b.name || ''));
        const va = a[sortKey] == null ? -Infinity : Number(a[sortKey]);
        const vb = b[sortKey] == null ? -Infinity : Number(b[sortKey]);
        return sortDir * (va - vb);
      });
    }
    function updateArrows() {
      document.querySelectorAll('th.sortable').forEach(th => {
        th.querySelector('.arr').textContent = th.dataset.sort === sortKey ? (sortDir < 0 ? '▼' : '▲') : '';
      });
    }
    document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'name') ? 1 : -1; }
      updateArrows();
      render(lastRows);
    }));
    updateArrows();

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
