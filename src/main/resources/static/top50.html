<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>오늘 거래량 탑50 · 시장 전체</title>
  <style>
    :root { --up:#e03131; --down:#1971c2; --line:#e9ecef; --muted:#868e96; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Apple SD Gothic Neo", Pretendard, sans-serif; margin:0; background:#f8f9fa; color:#212529; }
    header { padding:18px 24px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
    h1 { font-size:20px; margin:0; }
    .sub { color:var(--muted); font-size:13px; }
    .wrap { max-width:960px; margin:0 auto; padding:20px 24px; }
    .bar-wrap { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    button { padding:9px 16px; border:0; border-radius:8px; background:#228be6; color:#fff; font-size:14px; cursor:pointer; }
    button:disabled { background:#adb5bd; cursor:default; }
    .prog { flex:1; height:8px; background:#e9ecef; border-radius:4px; overflow:hidden; }
    .prog > i { display:block; height:100%; background:#37b24d; width:0; transition:width .4s; }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    th,td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); font-size:14px; }
    th { background:#f1f3f5; color:#495057; font-weight:600; font-size:12px; }
    th.sortable{cursor:pointer;user-select:none;} th.sortable:hover{color:#212529;}
    th .arr{font-size:10px;margin-left:3px;color:#868e96;}
    th:nth-child(1),td:nth-child(1){ text-align:center; width:44px; color:var(--muted); }
    th:nth-child(2),td:nth-child(2){ text-align:left; }
    td.num { font-variant-numeric:tabular-nums; }
    .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--muted);}
    .name{font-weight:600;} .code{color:var(--muted);font-size:12px;margin-left:6px;}
    .mkt{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#f1f3f5;color:#495057;margin-left:6px;}
    .sector{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e7f5ff;color:#1971c2;margin-left:6px;font-weight:600;}
    .sector.etc{background:#f1f3f5;color:#868e96;}
    .news-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;}
    .news-badge.nb-up{background:#ffe3e3;color:#e03131;} .news-badge.nb-down{background:#e7f5ff;color:#1971c2;}
    tr.clickable{cursor:pointer;} tr.clickable:hover td{background:#f8f9fa;}
    .banner{padding:10px 14px;border-radius:8px;margin-bottom:10px;font-weight:600;font-size:14px;}
    .banner.bear{background:#fff0f0;color:#c92a2a;border:1px solid #ffc9c9;}
    .banner.bull{background:#ebfbee;color:#2b8a3e;border:1px solid #b2f2bb;}
    .banner.flat{background:#f1f3f5;color:#495057;border:1px solid #e9ecef;}
    .breadth{padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;}
    .tup{color:#e03131;font-weight:700;} .tdn{color:#1971c2;font-weight:700;} .dimv{color:#adb5bd;}
    .dipok{color:#f08c00;font-weight:700;}
    .swcell{font-size:11px;white-space:nowrap;}
    .swbar{position:relative;height:5px;width:64px;background:#e9ecef;border-radius:3px;margin-bottom:2px;}
    .swbar i{position:absolute;top:-2px;width:3px;height:9px;background:#495057;border-radius:1px;transform:translateX(-50%);}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto;}
    .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2);}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;}
    .modal-head button{background:transparent;color:var(--muted);font-size:18px;padding:2px 8px;border:0;cursor:pointer;}
    .modal-body{padding:6px 18px 18px;max-height:70vh;overflow:auto;}
    .nrow{padding:12px 0;border-bottom:1px solid var(--line);} .nrow:last-child{border-bottom:0;}
    .nrow .nt{font-weight:600;font-size:14px;line-height:1.4;margin-top:4px;} .nrow .nt a{color:inherit;text-decoration:none;}
    .nrow .nm{color:var(--muted);font-size:12px;margin-top:4px;} .nrow .na{font-size:13px;color:#343a40;margin-top:6px;line-height:1.5;}
    .empty{text-align:center;color:var(--muted);padding:40px;}
  </style>
</head>
<body>
  <header>
    <h1>🔥 오늘 거래량 탑50</h1>
    <span class="sub">KRX 전체(KOSPI+KOSDAQ) 스캔 · 일배치</span>
    <span class="sub" id="asof" style="margin-left:auto"></span>
  </header>
  <div class="wrap">
    <div id="banner" class="banner" style="display:none"></div>
    <div id="breadth" class="breadth" style="display:none"></div>
    <div class="bar-wrap">
      <button id="refreshBtn">↻ 지금 갱신</button>
      <div class="prog"><i id="progBar"></i></div>
      <span class="sub" id="progTxt"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="rnk">#<span class="arr"></span></th>
          <th class="sortable" data-sort="name">종목<span class="arr"></span></th>
          <th class="sortable" data-sort="lastPrice">현재가<span class="arr"></span></th>
          <th class="sortable" data-sort="changeRate">등락률<span class="arr"></span></th>
          <th>흐름</th>
          <th class="sortable" data-sort="trendPct" title="현재가 vs 이동평균">추세<span class="arr"></span></th>
          <th class="sortable" data-sort="dipPct" title="최근 고점 대비 낙폭">딥<span class="arr"></span></th>
          <th class="sortable" data-sort="swingPos" title="지지~저항 내 현재 위치">스윙<span class="arr"></span></th>
          <th class="sortable" data-sort="volume">거래량<span class="arr"></span></th>
          <th class="sortable" data-sort="tradingValue">거래대금<span class="arr"></span></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td class="empty" colspan="10">불러오는 중…</td></tr></tbody>
    </table>
  </div>

  <div id="newsModal" class="modal-bg" style="display:none">
    <div class="modal">
      <div class="modal-head"><span id="modalTitle"></span><button id="modalClose">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const fmt = new Intl.NumberFormat('ko-KR');
    const $rows = document.getElementById('rows'), $btn = document.getElementById('refreshBtn');
    const $bar = document.getElementById('progBar'), $ptxt = document.getElementById('progTxt'), $asof = document.getElementById('asof');
    const cls = r => r==null?'flat':r>0?'up':r<0?'down':'flat';
    const sign = n => n>0?'+':'';

    let signals = {};
    const sDir = lv => (lv==='S1'||lv==='S2') ? 'down' : (lv==='S4'||lv==='S5') ? 'up' : 'flat';
    const sStr = lv => ({S1:2,S2:1,S4:1,S5:2})[lv] || 0;
    const sLabel = lv => ({S1:'강한악재',S2:'약한악재',S4:'약한호재',S5:'강한호재'})[lv] || '';
    function newsBadge(symbol, sector) {
      const a = signals[symbol], b = signals[sector];
      const lv = (sStr(a) >= sStr(b)) ? a : b;
      if (!lv || lv === 'S3') return '';
      const e = sDir(lv)==='down' ? '🔴' : '🟢';
      const on = (lv===a) ? symbol : sector;
      return `<span class="news-badge nb-${sDir(lv)}" title="${on} ${sLabel(lv)}">${e}${lv}</span>`;
    }

    async function load() {
      try {
        const [d, sig, ov] = await Promise.all([
          fetch('/api/top50').then(r => r.json()),
          fetch('/api/news/signals').then(r => r.ok ? r.json() : {}).catch(() => ({})),
          fetch('/api/market/overview').then(r => r.ok ? r.json() : null).catch(() => null)
        ]);
        signals = sig || {};
        renderOverview(ov);
        const running = d.state === 'RUNNING';
        $btn.disabled = running;
        $btn.textContent = running ? '집계 중…' : '↻ 지금 갱신';
        if (d.total > 0) {
          $bar.style.width = Math.round(d.scanned / d.total * 100) + '%';
          $ptxt.textContent = running ? `스캔 ${fmt.format(d.scanned)}/${fmt.format(d.total)}` : '';
        }
        $asof.textContent = d.asOf ? '기준 ' + new Date(d.asOf).toLocaleString('ko-KR') : (running ? '' : '아직 집계 전');
        lastRows = d.rows || [];
        const syms = lastRows.map(r => r.symbol).join(',');
        metrics = syms ? await fetch('/api/metrics?symbols=' + syms).then(r => r.ok ? r.json() : {}).catch(() => ({})) : {};
        render(lastRows);
      } catch (e) { $ptxt.textContent = '조회 실패'; }
    }

    // 시세 지표 (흐름/추세/딥/스윙/거래대금) + 마켓 배너/상승비율
    let metrics = {};
    function mv(sym, k) { return (metrics[sym] || {})[k]; }
    function krwShort(v) {
      if (v == null) return '<span class="dimv">-</span>';
      if (v >= 1e12) return (v / 1e12).toFixed(2) + '조';
      if (v >= 1e8) return Math.round(v / 1e8).toLocaleString('ko-KR') + '억';
      return Math.round(v).toLocaleString('ko-KR');
    }
    function spark(flow) {
      if (!flow || flow.length < 2) return '<span class="dimv">-</span>';
      const w = 64, h = 18, p = 2, mn = Math.min(...flow), mx = Math.max(...flow), rg = (mx - mn) || 1;
      const pts = flow.map((v, i) => `${(i / (flow.length - 1) * (w - 2 * p) + p).toFixed(1)},${(p + (h - 2 * p) - ((v - mn) / rg) * (h - 2 * p)).toFixed(1)}`).join(' ');
      const up = flow[flow.length - 1] >= flow[0];
      return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${up ? '#e03131' : '#1971c2'}" stroke-width="1.4"/></svg>`;
    }
    function trendCell(p) {
      if (p == null) return '<span class="dimv">-</span>';
      const up = p >= 0;
      return `<span class="${up ? 'tup' : 'tdn'}" title="이동평균 대비">${up ? '▲' : '▼'} ${p > 0 ? '+' : ''}${p}%</span>`;
    }
    function dipCell(sym) {
      const d = mv(sym, 'dipPct');
      if (d == null) return '<span class="dimv">-</span>';
      if (d <= 0.5) return '<span class="dimv">고점권</span>';
      const news = ['S4', 'S5'].includes(signals[sym]);
      const ok = d >= (news ? 6 : 15);
      return `<span class="${ok ? 'dipok' : 'dimv'}" title="고점대비 (딥기준 ${news ? 6 : 15}%)">${ok ? '딥✓ ' : ''}-${d}%</span>`;
    }
    function swingCell(sym) {
      const pos = mv(sym, 'swingPos'), lo = mv(sym, 'swingLow'), hi = mv(sym, 'swingHigh');
      if (pos == null) return '<span class="dimv">-</span>';
      const p = Math.max(0, Math.min(100, pos));
      const col = pos <= 30 ? '#2b8a3e' : (pos >= 75 ? '#e03131' : '#495057');
      return `<div class="swcell" title="지지 ${fmt.format(lo)} ~ 저항 ${fmt.format(hi)}"><div class="swbar"><i style="left:${p}%"></i></div><b style="color:${col}">${pos}%</b></div>`;
    }
    function renderOverview(ov) {
      const $b = document.getElementById('banner'), $br = document.getElementById('breadth');
      if (!ov) { $b.style.display = $br.style.display = 'none'; return; }
      const lv = ov.marketLevel, dir = sDir(lv);
      $b.style.display = 'block';
      $b.className = 'banner ' + (dir === 'down' ? 'bear' : dir === 'up' ? 'bull' : 'flat');
      $b.innerHTML = lv && lv !== 'S3'
        ? `${dir === 'down' ? '🛑' : '🟢'} 전체장 ${sLabel(lv)} — ${ov.marketNote || ''}`
        : '➖ 전체장 특이 뉴스 없음';
      $br.style.display = 'block';
      const pct = ov.breadthPct;
      const [ic, txt, bg, bd] = pct >= 60 ? ['🟢', '상승장', '#ebfbee', '#b2f2bb'] : pct >= 40 ? ['🟡', '중립', '#fff9db', '#ffe066'] : ['🔴', '하락장', '#fff0f0', '#ffc9c9'];
      $br.style.cssText = `padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;background:${bg};border:1px solid ${bd}`;
      $br.innerHTML = `<b>📊 시장 상승비율</b> ${ic} <b>${pct}% ${txt}</b> <span class="dimv">(${ov.up}/${ov.total} 종목, 전일대비 상승)</span>`;
    }

    // 컬럼 정렬 (클라이언트, 폴링 무관)
    let lastRows = [], sortKey = 'volume', sortDir = -1;
    const METRIC_KEYS = ['trendPct', 'dipPct', 'swingPos', 'tradingValue'];
    function sortVal(q) {
      return METRIC_KEYS.includes(sortKey) ? mv(q.symbol, sortKey) : q[sortKey];
    }
    function sortRows(rows) {
      return rows.slice().sort((a, b) => {
        if (sortKey === 'name') return sortDir * String(a.name || '').localeCompare(String(b.name || ''));
        const va = sortVal(a) == null ? -Infinity : Number(sortVal(a));
        const vb = sortVal(b) == null ? -Infinity : Number(sortVal(b));
        return sortDir * (va - vb);
      });
    }
    function updateArrows() {
      document.querySelectorAll('th.sortable').forEach(th => {
        th.querySelector('.arr').textContent = th.dataset.sort === sortKey ? (sortDir < 0 ? '▼' : '▲') : '';
      });
    }
    document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'name') ? 1 : -1; }
      updateArrows();
      render(lastRows);
    }));
    updateArrows();

    function render(rows) {
      if (!rows.length) {
        $rows.innerHTML = '<tr><td class="empty" colspan="10">아직 집계 결과가 없어요. “지금 갱신”을 누르면 전체 스캔이 시작됩니다(약 5분).</td></tr>';
        return;
      }
      $rows.innerHTML = sortRows(rows).map(q => {
        const rate = q.changeRate;
        const price = q.lastPrice != null ? fmt.format(q.lastPrice) : '-';
        const rateTxt = rate != null ? sign(rate) + rate.toFixed(2) + '%' : '-';
        const vol = q.volume != null ? fmt.format(q.volume) : '-';
        return `<tr class="clickable" data-symbol="${q.symbol}" data-sector="${q.sector || ''}" data-name="${q.name ?? ''}">
          <td>${q.rnk}</td>
          <td><span class="name">${q.name ?? '-'}</span><span class="code">${q.symbol}</span>${q.sector ? `<span class="sector ${q.sector==='기타'?'etc':''}">${q.sector}</span>` : ''}<span class="mkt">${q.market ?? ''}</span>${newsBadge(q.symbol, q.sector)}</td>
          <td class="num">${price}</td>
          <td class="num ${cls(rate)}">${rateTxt}</td>
          <td>${spark(mv(q.symbol,'flow'))}</td>
          <td>${trendCell(mv(q.symbol,'trendPct'))}</td>
          <td>${dipCell(q.symbol)}</td>
          <td>${swingCell(q.symbol)}</td>
          <td class="num">${vol}</td>
          <td class="num">${krwShort(mv(q.symbol,'tradingValue'))}</td>
        </tr>`;
      }).join('');
    }

    $btn.addEventListener('click', async () => {
      $btn.disabled = true;
      await fetch('/api/top50/refresh', { method: 'POST' });
      load();
    });

    // 행 클릭 → 관련 뉴스 모달
    const $modal = document.getElementById('newsModal'), $mTitle = document.getElementById('modalTitle'), $mBody = document.getElementById('modalBody');
    const closeModal = () => $modal.style.display = 'none';
    document.getElementById('modalClose').addEventListener('click', closeModal);
    $modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
    $rows.addEventListener('click', e => {
      const tr = e.target.closest('tr'); if (!tr || !tr.dataset.symbol) return;
      openNews(tr.dataset.symbol, tr.dataset.sector, tr.dataset.name);
    });

    async function openNews(symbol, sector, name) {
      $mTitle.textContent = (name || symbol) + ' · ' + symbol + (sector ? ' · ' + sector : '');
      $mBody.innerHTML = '<div class="nm" style="padding:14px 0">불러오는 중…</div>';
      $modal.style.display = 'flex';
      try {
        const reqs = [fetch('/api/news?limit=20&key=' + encodeURIComponent(symbol)).then(r => r.json())];
        if (sector) reqs.push(fetch('/api/news?limit=20&key=' + encodeURIComponent(sector)).then(r => r.json()));
        const seen = new Set(), merged = [];
        (await Promise.all(reqs)).flat().forEach(n => { if (!seen.has(n.id)) { seen.add(n.id); merged.push(n); } });
        merged.sort((a, b) => new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0));
        if (!merged.length) { $mBody.innerHTML = '<div class="nm" style="padding:14px 0">관련 활성 뉴스가 없어요.</div>'; return; }
        $mBody.innerHTML = merged.map(n => {
          const tags = (n.sentiment || '').split(',').map(p => { const [k, l] = p.split(':'); return { k, l }; })
            .filter(t => (t.k === symbol || t.k === sector) && t.l !== 'S3')
            .map(t => `<span class="news-badge nb-${sDir(t.l)}">${sDir(t.l)==='down'?'🔴':'🟢'}${t.l} ${sLabel(t.l)}</span>`).join('');
          const when = n.publishedAt ? new Date(n.publishedAt).toLocaleString('ko-KR') : '';
          const title = n.url ? `<a href="${n.url}" target="_blank">${n.title}</a>` : n.title;
          return `<div class="nrow"><div>${tags}</div><div class="nt">${title}</div><div class="nm">${n.source||''} · ${when} · ${n.kind||''}</div>${n.rationale?`<div class="na">${n.rationale}</div>`:''}</div>`;
        }).join('');
      } catch (e) { $mBody.innerHTML = '<div class="nm" style="padding:14px 0">불러오기 실패</div>'; }
    }

    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
