<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>내 보유 · 수익률 / 하드스탑</title>
  <style>
    :root { --up:#e03131; --down:#1971c2; --line:#e9ecef; --muted:#868e96; }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,sans-serif; margin:0; background:#f8f9fa; color:#212529; }
    header { padding:18px 24px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
    h1 { font-size:20px; margin:0; }
    .sub { color:var(--muted); font-size:13px; }
    .wrap { width:90%; max-width:1700px; margin:0 auto; padding:20px 24px; }
    form { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
    form label { font-size:12px; color:var(--muted); }
    input { padding:8px 10px; border:1px solid #ced4da; border-radius:8px; font-size:14px; }
    input[name=symbol]{width:120px;} input[name=buyPrice]{width:100px;} input[name=quantity]{width:80px;} input[name=stopPct]{width:64px;}
    button { padding:9px 16px; border:0; border-radius:8px; background:#228be6; color:#fff; font-size:14px; cursor:pointer; }
    button.del { background:transparent; color:var(--muted); padding:4px 8px; }
    button.del:hover { color:var(--up); }
    .summary { padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:14px; background:#fff; border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    th,td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); font-size:14px; }
    th { background:#f1f3f5; color:#495057; font-weight:600; font-size:12px; }
    th .hb{display:block;font-weight:400;color:#adb5bd;font-size:10px;margin-top:1px;letter-spacing:-.2px;}
    th:nth-child(1),td:nth-child(1){ text-align:left; }
    td.num { font-variant-numeric:tabular-nums; }
    .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--muted);} .dimv{color:#adb5bd;}
    .name{font-weight:600;} .code{color:var(--muted);font-size:12px;margin-left:6px;}
    .sector{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e7f5ff;color:#1971c2;margin-left:6px;font-weight:600;}
    tr.danger td { background:#fff5f5; }
    .stopbadge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;background:#ffe3e3;color:#e03131;margin-left:6px;}
    .empty{text-align:center;color:var(--muted);padding:40px;}
    .seg{display:inline-flex;border:1px solid #ced4da;border-radius:8px;overflow:hidden;}
    .seg button{background:#fff;color:#495057;border:0;border-radius:0;padding:8px 14px;font-size:13px;font-weight:600;}
    .seg button.on[data-side=BUY]{background:var(--up);color:#fff;}
    .seg button.on[data-side=SELL]{background:var(--down);color:#fff;}
    button.bf{background:transparent;color:#1971c2;padding:4px 7px;font-size:13px;}
    button.bf:hover{background:#e7f5ff;}
    button.exp{background:transparent;color:var(--muted);padding:4px 7px;font-size:13px;}
    button.exp:hover{background:#f1f3f5;}
    .actcell{white-space:nowrap;}
    tr.trades > td{background:#fbfcfd;padding:0;}
    .tradetbl{width:100%;border-collapse:collapse;}
    .tradetbl td{border-bottom:1px solid #f1f3f5;padding:7px 12px;font-size:13px;}
    .sidetag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;}
    .sidetag.BUY{background:#ffe3e3;color:#e03131;} .sidetag.SELL{background:#e7f1ff;color:#1971c2;}
    .qzero{color:#adb5bd;}
    .news-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;}
    .news-badge.nb-up{background:#ffe3e3;color:#e03131;} .news-badge.nb-down{background:#e7f5ff;color:#1971c2;}
    .filterbar{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);}
    .filterbar label{display:flex;gap:5px;align-items:center;cursor:pointer;}

    .topnav{display:flex;gap:4px;padding:8px 24px;background:#fff;border-bottom:1px solid #e9ecef;flex-wrap:wrap;position:sticky;top:0;z-index:40;}
    .topnav a{padding:7px 14px;border-radius:8px;text-decoration:none;color:#495057;font-size:14px;font-weight:600;}
    .topnav a:hover{background:#f1f3f5;}
    .topnav a.active{background:#212529;color:#fff;}
    .search-wrap{position:relative;display:inline-block;}
    .search-wrap input{width:230px;}
    .search-dd{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ced4da;border-radius:8px;margin-top:2px;max-height:280px;overflow:auto;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.12);}
    .search-dd .it{padding:8px 10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
    .search-dd .it:hover,.search-dd .it.sel{background:#f1f3f5;}
    .search-dd .it .mk{color:#868e96;font-size:11px;}
  </style>
</head>
<body>
  <nav class="topnav">
    <a href="/top50.html">🔥 탑50</a>
    <a href="/watchlist.html">📈 워치리스트</a>
    <a href="/news.html">📰 뉴스</a>
    <a href="/holdings.html" class="active">💼 내 보유</a>
  </nav>
  <header>
    <h1>💼 내 보유</h1>
    <span class="sub">수동 입력 · 수익률 / 하드스탑 · 10초 갱신</span>
    <span class="sub" id="updated" style="margin-left:auto"></span>
  </header>
  <div class="wrap">
    <form id="addForm">
      <span class="seg" id="sideSeg">
        <button type="button" class="on" data-side="BUY">매수</button>
        <button type="button" data-side="SELL">매도</button>
      </span>
      <span class="search-wrap"><input id="hdSearch" placeholder="종목명/코드 검색 (삼성, apple…)" autocomplete="off" required/><div class="search-dd" style="display:none"></div></span>
      <label>일시 <input name="buyAt" type="datetime-local" required/></label>
      <input name="buyPrice" type="number" step="0.01" min="0" placeholder="가격" required/>
      <input name="quantity" type="number" step="1" min="0" placeholder="수량"/>
      <label>손절 <input name="stopPct" type="number" step="0.5" min="0" value="8"/>%</label>
      <button type="submit">+ 거래 추가</button>
    </form>
    <div id="summary" class="summary" style="display:none"></div>
    <div class="filterbar"><label><input type="checkbox" id="showClosed"/> 청산(순수량 0) 종목 표시</label></div>
    <table>
      <thead>
        <tr>
          <th>종목</th><th title="순보유=Σ매수−Σ매도">순수량<span class="hb">매수−매도</span></th><th title="매수 가중평균 단가">평단가<span class="hb">매수가중</span></th><th>현재가</th><th title="전일 종가 대비 등락">1일<span class="hb">전일대비</span></th><th title="7일 전 종가 대비 등락">7일<span class="hb">7일전</span></th><th title="(현재−평단)/평단">수익률<span class="hb">vs평단</span></th>
          <th title="순수량×(현재−평단)">평가손익<span class="hb">미실현</span></th><th title="Σ매도수량×(매도가−평단)">실현손익<span class="hb">매도실현</span></th><th title="최초 매수일 이후 경과">보유일<span class="hb">최초매수후</span></th>
          <th title="평단×(1−손절%)">스탑가<span class="hb">평단·-N%</span></th><th title="현재가 대비 스탑까지 여유">스탑까지<span class="hb">vs현재가</span></th>
          <th title="최초 매수일 이후 최고가">매수후고점<span class="hb">최초매수후</span></th><th title="고점 대비 현재 낙폭(MDD)">고점대비<span class="hb">낙폭</span></th><th></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td class="empty" colspan="13">불러오는 중…</td></tr></tbody>
    </table>
  </div>

  <script>
    const fmt = new Intl.NumberFormat('ko-KR');
    const $rows = document.getElementById('rows'), $updated = document.getElementById('updated'), $sum = document.getElementById('summary');
    const cls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
    const sign = v => v > 0 ? '+' : '';
    const n = (v, d=0) => v == null ? '<span class="dimv">-</span>' : fmt.format(Number(Number(v).toFixed(d)));
    const pct = v => v == null ? '<span class="dimv">-</span>' : `<span class="${cls(v)}">${sign(v)}${v.toFixed(2)}%</span>`;
    const when = t => t ? new Date(t).toLocaleDateString('ko-KR', {year:'2-digit',month:'2-digit',day:'2-digit'}) : '-';

    // 뉴스 S뱃지(탑50/워치리스트와 동일 소스)
    let signals = {};
    const sDir = lv => (lv==='S1'||lv==='S2') ? 'down' : (lv==='S4'||lv==='S5') ? 'up' : 'flat';
    const sStr = lv => ({S1:2,S2:1,S4:1,S5:2})[lv] || 0;
    const sLabel = lv => ({S1:'강한악재',S2:'약한악재',S4:'약한호재',S5:'강한호재'})[lv] || '';
    function newsBadge(symbol, sector) {
      const a = signals[symbol], b = signals[sector];
      const lv = (sStr(a) >= sStr(b)) ? a : b;
      if (!lv || lv === 'S3') return '';
      const e = sDir(lv)==='down' ? '🔴' : '🟢';
      const on = (lv===a) ? symbol : sector;
      return `<span class="news-badge nb-${sDir(lv)}" title="${on} ${sLabel(lv)}">${e}${lv}</span>`;
    }

    let lastRows = [];
    async function load() {
      try {
        const [rows, sig] = await Promise.all([
          fetch('/api/holdings').then(r => r.json()),
          fetch('/api/news/signals').then(r => r.ok ? r.json() : {}).catch(() => ({}))
        ]);
        signals = sig || {};
        lastRows = rows;
        render();
        $updated.textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR');
      } catch (e) { $updated.textContent = '조회 실패'; }
    }

    const expanded = new Set();  // 펼친 종목(갱신해도 유지)
    function render() {
      const showClosed = document.getElementById('showClosed').checked;
      const rows = showClosed ? lastRows : lastRows.filter(h => h.netQty !== 0);
      if (!lastRows.length) {
        $rows.innerHTML = '<tr><td class="empty" colspan="15">보유 종목이 없어요. 위에서 매수 거래를 추가하세요.</td></tr>';
        $sum.style.display = 'none';
        return;
      }
      if (!rows.length) {
        $rows.innerHTML = '<tr><td class="empty" colspan="15">표시할 종목이 없어요. ‘청산 종목 표시’를 켜보세요.</td></tr>';
        $sum.style.display = 'none';
        return;
      }
      let totU = 0, hasU = false, totR = 0, hasR = false, retSum = 0, retCnt = 0;
      $rows.innerHTML = rows.map(h => {
        if (h.unrealizedAmount != null) { totU += h.unrealizedAmount; hasU = true; }
        if (h.realizedAmount != null) { totR += h.realizedAmount; hasR = true; }
        if (h.unrealizedPct != null) { retSum += h.unrealizedPct; retCnt++; }
        const danger = h.belowStop;
        const stopHit = h.stopHitSinceBuy && !h.belowStop;
        const open = expanded.has(h.symbol);
        const qty = h.netQty == null ? '<span class="dimv">-</span>'
          : (h.netQty === 0 ? '<span class="qzero">0 청산</span>' : fmt.format(h.netQty));
        const row = `<tr class="${danger ? 'danger' : ''}">
          <td><span class="name">${h.name ?? '-'}</span><span class="code">${h.symbol}</span>${h.sector ? `<span class="sector">${h.sector}</span>` : ''}${newsBadge(h.symbol, h.sector)}${danger ? '<span class="stopbadge">🔴 손절</span>' : ''}</td>
          <td class="num">${qty}</td>
          <td class="num">${n(h.avgCost, 2)}</td>
          <td class="num">${n(h.currentPrice)}</td>
          <td class="num">${pct(h.change1dPct)}</td>
          <td class="num">${pct(h.change7dPct)}</td>
          <td class="num">${pct(h.unrealizedPct)}</td>
          <td class="num ${cls(h.unrealizedAmount)}">${h.unrealizedAmount == null ? '<span class="dimv">-</span>' : sign(h.unrealizedAmount) + n(h.unrealizedAmount)}</td>
          <td class="num ${cls(h.realizedAmount)}">${h.realizedAmount == null ? '<span class="dimv">-</span>' : sign(h.realizedAmount) + n(h.realizedAmount)}</td>
          <td class="num">${h.daysHeld == null ? '-' : h.daysHeld + '일'}</td>
          <td class="num">${n(h.stopPrice, 2)} <span class="dimv" style="font-size:11px">-${h.stopPct}%</span></td>
          <td class="num">${h.stopDistPct == null ? '<span class="dimv">-</span>' : `<span class="${h.stopDistPct < 0 ? 'up' : 'down'}">${h.stopDistPct > 0 ? '+' : ''}${h.stopDistPct.toFixed(1)}%</span>`}${stopHit ? ' <span title="보유 중 스탑가를 터치한 적 있음" class="dimv">⚠터치</span>' : ''}</td>
          <td class="num">${n(h.peakSinceBuy)}</td>
          <td class="num">${h.ddFromPeak == null ? '<span class="dimv">-</span>' : `<span class="down">-${h.ddFromPeak.toFixed(2)}%</span>`}</td>
          <td class="actcell"><button class="bf" data-sym="${h.symbol}" data-from="${h.firstBuyAt ? h.firstBuyAt.slice(0, 10) : ''}" title="일봉 백필">↻</button><button class="exp" data-sym="${h.symbol}" title="거래내역">${open ? '▾' : '▸'}${h.trades.length}</button></td>
        </tr>`;
        const sub = open ? `<tr class="trades"><td colspan="15"><table class="tradetbl">${h.trades.map(t => `
          <tr><td style="text-align:left"><span class="sidetag ${t.side}">${t.side === 'SELL' ? '매도' : '매수'}</span></td>
          <td class="num">${when(t.tradedAt)}</td>
          <td class="num">${n(t.price, 2)}</td>
          <td class="num">${t.quantity == null ? '<span class="dimv">-</span>' : fmt.format(t.quantity) + '주'}</td>
          <td class="num">${pct(t.returnPct)}</td>
          <td style="text-align:right"><button class="del" data-id="${t.id}" title="이 거래 삭제">✕</button></td></tr>`).join('')}</table></td></tr>` : '';
        return row + sub;
      }).join('');
      $sum.style.display = 'block';
      const avg = retCnt ? (retSum / retCnt) : null;
      $sum.innerHTML = `📊 보유 <b>${rows.length}</b>종목 · 평균 수익률 ${pct(avg)}`
        + ` · 평가손익 ${hasU ? `<b class="${cls(totU)}">${sign(totU)}${n(totU)}원</b>` : '<span class="dimv">-</span>'}`
        + ` · 실현손익 ${hasR ? `<b class="${cls(totR)}">${sign(totR)}${n(totR)}원</b>` : '<span class="dimv">-</span>'}`;
    }

    // 종목 검색 자동완성
    function extractCode(v) {
      const m = (v || '').match(/\(([A-Za-z0-9.\-]+)\)\s*$/);
      if (m) return m[1];
      const t = (v || '').trim();
      return /^[A-Za-z0-9.\-]{1,12}$/.test(t) ? t : null;
    }
    function attachSearch(input, onPick) {
      const dd = input.parentElement.querySelector('.search-dd');
      let t = null, items = [], sel = -1;
      const hide = () => { dd.style.display = 'none'; sel = -1; };
      input.addEventListener('input', () => {
        onPick(null);
        const q = input.value.trim();
        clearTimeout(t);
        if (!q) { hide(); return; }
        t = setTimeout(async () => {
          try { items = await (await fetch('/api/search?limit=12&q=' + encodeURIComponent(q))).json(); } catch (e) { items = []; }
          if (!items.length) { hide(); return; }
          dd.innerHTML = items.map((h, i) => `<div class="it" data-i="${i}"><span><b>${h.name}</b> <span class="mk">${h.symbol}</span></span><span class="mk">${h.market || ''}</span></div>`).join('');
          dd.style.display = 'block'; sel = -1;
        }, 220);
      });
      dd.addEventListener('mousedown', e => { const it = e.target.closest('.it'); if (it) pick(items[+it.dataset.i]); });
      input.addEventListener('keydown', e => {
        if (dd.style.display === 'none') return;
        const its = [...dd.querySelectorAll('.it')];
        if (e.key === 'ArrowDown') sel = Math.min(sel + 1, its.length - 1);
        else if (e.key === 'ArrowUp') sel = Math.max(sel - 1, 0);
        else if (e.key === 'Enter') { if (sel >= 0) { e.preventDefault(); pick(items[sel]); } return; }
        else return;
        e.preventDefault(); its.forEach((x, i) => x.classList.toggle('sel', i === sel)); its[sel] && its[sel].scrollIntoView({ block: 'nearest' });
      });
      input.addEventListener('blur', () => setTimeout(hide, 150));
      function pick(h) { if (!h) return; input.value = h.name + ' (' + h.symbol + ')'; onPick(h.symbol); hide(); }
    }

    // 매수/매도 토글
    let side = 'BUY';
    document.getElementById('sideSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-side]'); if (!b) return;
      side = b.dataset.side;
      [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
    });

    let hdChosen = null;
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const sym = hdChosen || extractCode(document.getElementById('hdSearch').value);
      if (!sym) { alert('종목을 검색해 선택하세요.'); return; }
      const qty = f.quantity.value ? parseInt(f.quantity.value, 10) : null;
      if (side === 'SELL' && !qty) { alert('매도는 수량이 필수입니다.'); return; }
      const body = {
        symbol: sym, side,
        buyAt: f.buyAt.value || null,
        buyPrice: parseFloat(f.buyPrice.value),
        quantity: qty,
        stopPct: f.stopPct.value ? parseFloat(f.stopPct.value) : 8,
        memo: null
      };
      const res = await fetch('/api/holdings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) { alert('추가 실패 (HTTP ' + res.status + ') ' + (await res.text().catch(() => ''))); return; }
      document.getElementById('hdSearch').value = ''; f.buyPrice.value = ''; f.quantity.value = ''; hdChosen = null;
      document.getElementById('hdSearch').focus();
      load();
    });
    attachSearch(document.getElementById('hdSearch'), s => { hdChosen = s; });

    $rows.addEventListener('click', async (e) => {
      const del = e.target.closest('button.del');
      if (del) {
        if (!confirm('이 거래를 삭제할까요?')) return;
        await fetch('/api/holdings/' + del.dataset.id, { method: 'DELETE' });
        load(); return;
      }
      const exp = e.target.closest('button.exp');
      if (exp) {
        const s = exp.dataset.sym;
        expanded.has(s) ? expanded.delete(s) : expanded.add(s);
        load(); return;
      }
      const bf = e.target.closest('button.bf');
      if (bf) {
        const s = bf.dataset.sym, from = bf.dataset.from;
        bf.disabled = true; bf.textContent = '…';
        try {
          const url = '/api/daily/backfill-symbol?symbol=' + encodeURIComponent(s) + (from ? '&from=' + from : '');
          const r = await fetch(url, { method: 'POST' });
          bf.textContent = r.ok ? '✓' : '✕';
        } catch { bf.textContent = '✕'; }
        setTimeout(() => { bf.disabled = false; bf.textContent = '↻'; }, 2500);
        return;
      }
    });

    // 청산 필터 토글 → 즉시 다시 그림(재조회 없이)
    document.getElementById('showClosed').addEventListener('change', render);

    // 매수일시 기본값 = 지금
    (function () {
      const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      document.querySelector('input[name=buyAt]').value = d.toISOString().slice(0, 16);
    })();

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
