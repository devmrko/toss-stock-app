<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>내 보유 · 수익률 / 하드스탑</title>
  <style>
    :root { --up:#e03131; --down:#1971c2; --line:#e9ecef; --muted:#868e96; }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,sans-serif; margin:0; background:#f8f9fa; color:#212529; }
    header { padding:18px 24px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
    h1 { font-size:20px; margin:0; }
    .sub { color:var(--muted); font-size:13px; }
    .wrap { width:90%; max-width:1700px; margin:0 auto; padding:20px 24px; }
    form { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
    form label { font-size:12px; color:var(--muted); }
    input { padding:8px 10px; border:1px solid #ced4da; border-radius:8px; font-size:14px; }
    input[name=symbol]{width:120px;} input[name=buyPrice]{width:100px;} input[name=quantity]{width:80px;} input[name=stopPct]{width:64px;}
    button { padding:9px 16px; border:0; border-radius:8px; background:#228be6; color:#fff; font-size:14px; cursor:pointer; }
    button.del { background:transparent; color:var(--muted); padding:4px 8px; }
    button.del:hover { color:var(--up); }
    .summary { padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:14px; background:#fff; border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    th,td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); font-size:14px; }
    th { background:#f1f3f5; color:#495057; font-weight:600; font-size:12px; }
    th:nth-child(1),td:nth-child(1){ text-align:left; }
    td.num { font-variant-numeric:tabular-nums; }
    .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--muted);} .dimv{color:#adb5bd;}
    .name{font-weight:600;} .code{color:var(--muted);font-size:12px;margin-left:6px;}
    .sector{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e7f5ff;color:#1971c2;margin-left:6px;font-weight:600;}
    tr.danger td { background:#fff5f5; }
    .stopbadge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;background:#ffe3e3;color:#e03131;margin-left:6px;}
    .empty{text-align:center;color:var(--muted);padding:40px;}
  </style>
</head>
<body>
  <header>
    <h1>💼 내 보유</h1>
    <span class="sub">수동 입력 · 수익률 / 하드스탑 · 10초 갱신</span>
    <span class="sub" id="updated" style="margin-left:auto"></span>
  </header>
  <div class="wrap">
    <form id="addForm">
      <input name="symbol" placeholder="종목코드 005930" maxlength="6" required/>
      <label>매수일시 <input name="buyAt" type="datetime-local" required/></label>
      <input name="buyPrice" type="number" step="0.01" min="0" placeholder="매수가" required/>
      <input name="quantity" type="number" step="1" min="0" placeholder="수량(선택)"/>
      <label>손절 <input name="stopPct" type="number" step="0.5" min="0" value="8"/>%</label>
      <button type="submit">+ 추가</button>
    </form>
    <div id="summary" class="summary" style="display:none"></div>
    <table>
      <thead>
        <tr>
          <th>종목</th><th>매수일</th><th>매수가</th><th>현재가</th><th>수익률</th>
          <th>수량</th><th>평가손익</th><th>보유일</th>
          <th title="매수가×(1−손절%)">스탑가(-N%)</th><th title="현재가 대비 스탑까지 여유">스탑까지</th>
          <th title="매수 후 최고가">매수후고점</th><th title="고점 대비 현재 낙폭">고점대비</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td class="empty" colspan="13">불러오는 중…</td></tr></tbody>
    </table>
  </div>

  <script>
    const fmt = new Intl.NumberFormat('ko-KR');
    const $rows = document.getElementById('rows'), $updated = document.getElementById('updated'), $sum = document.getElementById('summary');
    const cls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
    const sign = v => v > 0 ? '+' : '';
    const n = (v, d=0) => v == null ? '<span class="dimv">-</span>' : fmt.format(Number(Number(v).toFixed(d)));
    const pct = v => v == null ? '<span class="dimv">-</span>' : `<span class="${cls(v)}">${sign(v)}${v.toFixed(2)}%</span>`;
    const when = t => t ? new Date(t).toLocaleDateString('ko-KR', {year:'2-digit',month:'2-digit',day:'2-digit'}) : '-';

    async function load() {
      try {
        const rows = await (await fetch('/api/holdings')).json();
        render(rows);
        $updated.textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR');
      } catch (e) { $updated.textContent = '조회 실패'; }
    }

    function render(rows) {
      if (!rows.length) {
        $rows.innerHTML = '<tr><td class="empty" colspan="13">보유 항목이 없어요. 위에서 종목·매수일·매수가를 입력해 추가하세요.</td></tr>';
        $sum.style.display = 'none';
        return;
      }
      let totPnl = 0, hasPnl = false, retSum = 0, retCnt = 0;
      $rows.innerHTML = rows.map(h => {
        if (h.returnAmount != null) { totPnl += h.returnAmount; hasPnl = true; }
        if (h.returnPct != null) { retSum += h.returnPct; retCnt++; }
        const danger = h.belowStop;
        const stopHit = h.stopHitSinceBuy && !h.belowStop;
        return `<tr class="${danger ? 'danger' : ''}">
          <td><span class="name">${h.name ?? '-'}</span><span class="code">${h.symbol}</span>${h.sector ? `<span class="sector">${h.sector}</span>` : ''}${danger ? '<span class="stopbadge">🔴 손절</span>' : ''}</td>
          <td class="num">${when(h.buyAt)}</td>
          <td class="num">${n(h.buyPrice)}</td>
          <td class="num">${n(h.currentPrice)}</td>
          <td class="num">${pct(h.returnPct)}</td>
          <td class="num">${h.quantity == null ? '<span class="dimv">-</span>' : fmt.format(h.quantity)}</td>
          <td class="num ${cls(h.returnAmount)}">${h.returnAmount == null ? '<span class="dimv">-</span>' : sign(h.returnAmount) + n(h.returnAmount)}</td>
          <td class="num">${h.daysHeld == null ? '-' : h.daysHeld + '일'}</td>
          <td class="num">${n(h.stopPrice)} <span class="dimv" style="font-size:11px">-${h.stopPct}%</span></td>
          <td class="num">${h.stopDistPct == null ? '<span class="dimv">-</span>' : `<span class="${h.stopDistPct < 0 ? 'up' : 'down'}">${h.stopDistPct > 0 ? '+' : ''}${h.stopDistPct.toFixed(1)}%</span>`}${stopHit ? ' <span title="보유 중 스탑가를 터치한 적 있음" class="dimv">⚠터치</span>' : ''}</td>
          <td class="num">${n(h.peakSinceBuy)}</td>
          <td class="num">${h.ddFromPeak == null ? '<span class="dimv">-</span>' : `<span class="down">-${h.ddFromPeak.toFixed(2)}%</span>`}</td>
          <td><button class="del" data-id="${h.id}" title="삭제">✕</button></td>
        </tr>`;
      }).join('');
      $sum.style.display = 'block';
      const avg = retCnt ? (retSum / retCnt) : null;
      $sum.innerHTML = `📊 보유 <b>${rows.length}</b>종목 · 평균 수익률 ${pct(avg)} · 총 평가손익 ${hasPnl ? `<b class="${cls(totPnl)}">${sign(totPnl)}${n(totPnl)}원</b>` : '<span class="dimv">수량 입력시 표시</span>'}`;
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = {
        symbol: f.symbol.value.trim(),
        buyAt: f.buyAt.value || null,
        buyPrice: parseFloat(f.buyPrice.value),
        quantity: f.quantity.value ? parseInt(f.quantity.value, 10) : null,
        stopPct: f.stopPct.value ? parseFloat(f.stopPct.value) : 8,
        memo: null
      };
      const res = await fetch('/api/holdings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) { alert('추가 실패 (HTTP ' + res.status + ')'); return; }
      f.symbol.value = ''; f.buyPrice.value = ''; f.quantity.value = ''; f.symbol.focus();
      load();
    });

    $rows.addEventListener('click', async (e) => {
      const btn = e.target.closest('button.del'); if (!btn) return;
      if (!confirm('이 보유 항목을 삭제할까요?')) return;
      await fetch('/api/holdings/' + btn.dataset.id, { method: 'DELETE' });
      load();
    });

    // 매수일시 기본값 = 지금
    (function () {
      const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      document.querySelector('input[name=buyAt]').value = d.toISOString().slice(0, 16);
    })();

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
